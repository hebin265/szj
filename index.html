<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0A1620">
<title>时光侦局 · 穿越千年 亲历历史</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --bg:#0A1620; --bg2:#101E2A; --bg3:#162836;
  --gold:#C49E54; --gold2:#E8C878; --gold3:#F0D79A; --gold4:#A87F35;
  --teal:#3F8F86; --teal2:#5FB3A7; --cream:#E9E2CF; --muted:#8B9E98;
  --line:rgba(196,158,84,.28);
  --serif:'Noto Serif SC','Songti SC',Georgia,serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#05090D;color:var(--cream);font-family:var(--sans)}
body{display:flex;justify-content:center}
#phone{width:100%;max-width:480px;min-height:100vh;position:relative;background:
  radial-gradient(120% 60% at 50% 0%,#12283A 0%,rgba(10,22,32,0) 60%),var(--bg);
  padding-bottom:96px;overflow-x:hidden}
#phone::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(196,158,84,.18) 1px,transparent 1px);background-size:26px 26px}
#app{position:relative;z-index:1}
a{color:inherit;text-decoration:none}
img{display:block}

/* ---------- 通用 ---------- */
.wrap{padding:18px 18px 8px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:12px 14px;background:rgba(10,22,32,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.back{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.03);cursor:pointer;font-size:15px;color:var(--gold2);flex:0 0 auto}
.ttl{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:1px;color:var(--cream);flex:1}
.sub{font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:2px}
.card{background:linear-gradient(160deg,rgba(22,40,54,.96),rgba(12,24,34,.96));border:1px solid var(--line);
  border-radius:16px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.card::after{content:'';position:absolute;left:0;top:0;width:100%;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5}
.card.tap{cursor:pointer;transition:transform .15s, border-color .15s}
.card.tap:active{transform:scale(.985);border-color:rgba(196,158,84,.55)}
.h1{font-family:var(--serif);font-size:22px;font-weight:900;letter-spacing:2px;margin:0 0 6px}
.h2{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:1px;margin:0 0 8px;color:var(--gold2)}
.muted{color:var(--muted);font-size:12px;line-height:1.7}
.gold{color:var(--gold2)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:pointer;
  font-family:var(--sans);font-size:14px;font-weight:500;padding:12px 18px;border-radius:12px;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97);opacity:.92}
.btn.primary{background:linear-gradient(135deg,var(--gold3),var(--gold2) 45%,var(--gold4));color:#231A0C;
  box-shadow:0 6px 18px rgba(196,158,84,.28)}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--cream);border:1px solid var(--line)}
.btn.block{display:flex;width:100%}
.btn.sm{padding:8px 12px;font-size:12px;border-radius:10px}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.ipt{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:12px;outline:0;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--cream);
  font-family:var(--sans);font-size:13px}
.ipt::placeholder{color:rgba(216,230,223,.42)}
.ipt:focus{border-color:rgba(232,200,120,.45)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);
  font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,rgba(232,200,120,.22),rgba(196,158,84,.1));color:var(--gold2);border-color:rgba(232,200,120,.55)}
.tag{font-size:10px;padding:3px 8px;border-radius:6px;background:rgba(95,179,167,.16);color:var(--teal2);border:1px solid rgba(95,179,167,.3)}
.tag.gold{background:rgba(232,200,120,.14);color:var(--gold2);border-color:rgba(232,200,120,.34)}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:14px 0}
.progressbar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.progressbar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal2),var(--gold2))}
.stars{letter-spacing:2px;color:var(--gold2);font-size:13px}
.stars i{color:rgba(255,255,255,.16);font-style:normal}

/* ---------- 启动页 ---------- */
.splash{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:0}
.splash .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.splash .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,14,20,.55) 0%,rgba(6,14,20,.25) 40%,rgba(6,14,20,.96) 100%)}
.splash .inner{position:relative;z-index:2;padding:0 24px 48px;text-align:center}
.splash .logo{font-family:var(--serif);font-size:40px;font-weight:900;letter-spacing:10px;color:var(--gold3);
  text-shadow:0 0 30px rgba(232,200,120,.4),0 4px 20px rgba(0,0,0,.6)}
.splash .slog{font-family:var(--serif);font-size:13px;letter-spacing:6px;color:var(--cream);opacity:.86;margin-top:14px}
.splash .latin{font-size:10px;letter-spacing:3px;color:var(--muted);margin-top:10px}
.splash .btn.primary{margin-top:30px;width:100%;padding:15px;font-family:var(--serif);font-size:16px;letter-spacing:4px}

/* ---------- 首页 ---------- */
.hello{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
.ava{width:46px;height:46px;border-radius:50%;overflow:hidden;border:1px solid rgba(232,200,120,.5);background:#16283A;flex:0 0 auto}
.ava img{width:100%;height:100%;object-fit:cover}
.hello .who{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:1px}
.hello .tip{font-size:11px;color:var(--muted);margin-top:3px}
.points{display:flex;background:linear-gradient(120deg,rgba(232,200,120,.13),rgba(63,143,134,.1));
  border:1px solid rgba(232,200,120,.32);border-radius:16px;padding:14px 6px;margin-bottom:16px}
.points > div{flex:1;text-align:center;position:relative}
.points > div + div::before{content:none}
.points b{display:block;font-family:var(--serif);font-size:22px;color:var(--gold2);font-weight:900}
.points span{font-size:10px;color:var(--muted);letter-spacing:1px}
.entry{display:flex;gap:12px;align-items:center}
.entry .ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:19px;font-weight:700;color:#241B0C;
  background:linear-gradient(135deg,var(--gold3),var(--gold4));flex:0 0 auto}
.entry .ico.t{background:linear-gradient(135deg,var(--teal2),var(--teal));color:#07100F}
.entry .name{font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.5px}
.entry .desc{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.6}
.entry .go{color:var(--gold);font-size:18px}

/* ---------- 剧本 ---------- */
.script{display:flex;gap:14px}
.script .cover{width:76px;height:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line);flex:0 0 auto}
.script .cover img{width:100%;height:100%;object-fit:cover}
.acts{display:flex;gap:8px;margin:6px 0 12px}
.act{flex:1;padding:10px 6px;border-radius:12px;text-align:center;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer}
.act b{display:block;font-family:var(--serif);font-size:12px;font-weight:700;color:var(--cream)}
.act span{font-size:10px;color:var(--muted)}
.act.on{border-color:rgba(232,200,120,.6);background:linear-gradient(160deg,rgba(232,200,120,.16),rgba(196,158,84,.05))}
.act.on b{color:var(--gold2)}
.act.done span{color:var(--teal2)}
.chat{display:flex;flex-direction:column;gap:12px;margin:4px 0 10px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg .who{font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:4px}
.msg .bubble{max-width:84%;padding:11px 13px;border-radius:14px;font-size:13px;line-height:1.75;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);color:#DCD5C2}
.msg.ai .bubble{border-color:rgba(196,158,84,.3);background:linear-gradient(150deg,rgba(196,158,84,.1),rgba(255,255,255,.02))}
.msg.me{justify-content:flex-end}
.msg.me .bubble{background:linear-gradient(135deg,rgba(232,200,120,.22),rgba(168,127,53,.14));color:var(--cream);border-color:rgba(232,200,120,.3)}
.missions{margin:10px 0 4px}
.mission{display:flex;gap:9px;align-items:center;font-size:12.5px;color:#CFC8B6;padding:7px 0;cursor:pointer}
.mission .box{width:17px;height:17px;border-radius:5px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:#0A1620}
.mission.on .box{background:linear-gradient(135deg,var(--gold3),var(--gold2));border-color:transparent}
.mission.on{color:var(--gold2)}
.inputbar{display:flex;gap:8px;margin-top:10px}
.inputbar input{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;color:var(--cream);font-size:13px;font-family:var(--sans);outline:none}
.inputbar input::placeholder{color:#66796F}

/* ---------- 短剧 ---------- */
.ep{display:flex;gap:12px;padding:10px;border-radius:14px;border:1px solid var(--line);margin-bottom:12px;
  background:linear-gradient(150deg,rgba(22,40,54,.9),rgba(12,24,34,.9));cursor:pointer;align-items:center}
.ep .thumb{width:64px;height:86px;border-radius:10px;overflow:hidden;flex:0 0 auto;position:relative}
.ep .thumb img{width:100%;height:100%;object-fit:cover}
.ep .thumb b{position:absolute;left:5px;top:5px;font-size:9px;padding:2px 5px;border-radius:4px;background:rgba(10,22,32,.8);color:var(--gold2)}
.ep .meta{flex:1;min-width:0}
.ep .t{font-family:var(--serif);font-size:14px;font-weight:700}
.ep .d{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.6}
.player{width:100%;aspect-ratio:9/16;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.player video{width:100%;height:100%;object-fit:cover}
.choice2{display:flex;gap:10px;margin-top:12px}
.choice2 .btn{flex:1;min-height:46px;height:auto;white-space:normal;text-align:left;font-size:13px;line-height:1.5;padding:10px 12px}

/* ---------- 闯关 ---------- */
.level{display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;border:1px solid var(--line);
  background:linear-gradient(150deg,rgba(22,40,54,.9),rgba(12,24,34,.9));margin-bottom:12px;cursor:pointer}
.level .ch{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:20px;font-weight:700;color:#241B0C;background:linear-gradient(135deg,var(--gold3),var(--gold4))}
.level .lname{font-family:var(--serif);font-size:14px;font-weight:700}
.level .lsub{font-size:11px;color:var(--muted);margin-top:4px}
.material{background:rgba(63,143,134,.08);border:1px dashed rgba(95,179,167,.36);border-radius:12px;padding:13px;
  font-family:var(--serif);font-size:13.5px;line-height:1.9;color:#D8E6DF;margin-bottom:14px}
.qtext{font-family:var(--serif);font-size:15px;line-height:1.7;margin-bottom:12px;color:#F2ECDB}
.opt{display:flex;gap:10px;align-items:flex-start;padding:13px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);margin-bottom:10px;cursor:pointer;font-size:13px;line-height:1.6;transition:.15s}
.opt:active{transform:scale(.99)}
.opt .k{font-family:var(--serif);font-weight:700;color:var(--gold2);width:16px;flex:0 0 auto}
.opt.right{border-color:rgba(95,179,167,.7);background:rgba(63,143,134,.18)}
.opt.wrong{border-color:rgba(179,90,90,.6);background:rgba(160,60,60,.16)}
.analysis{border-left:2px solid var(--gold);padding:10px 12px;background:rgba(196,158,84,.08);
  border-radius:0 10px 10px 0;font-size:12.5px;line-height:1.8;color:#DFD8C6;margin-top:12px}

/* ---------- 图鉴 ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc{border:1px solid var(--line);border-radius:14px;padding:12px;background:linear-gradient(160deg,rgba(22,40,54,.9),rgba(12,24,34,.92));
  cursor:pointer;text-align:center;position:relative;overflow:hidden}
.rc .pic{height:96px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.rc .pic img{max-height:96px;max-width:100%;object-fit:contain}
.rc .pic.lock{font-size:26px;color:rgba(255,255,255,.16)}
.rc .n{font-family:var(--serif);font-size:13px;font-weight:700}
.rc .e{font-size:10px;color:var(--muted);margin-top:3px}
.rc.locked{opacity:.7}
.big{height:190px;display:flex;align-items:center;justify-content:center;margin:4px 0 14px}
.big img{max-height:190px;max-width:100%;object-fit:contain;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.kv{display:flex;gap:10px;font-size:12.5px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
.kv b{color:var(--muted);font-weight:400;width:64px;flex:0 0 auto}
.quote{font-family:var(--serif);font-size:13px;line-height:1.9;color:var(--gold2);border-left:2px solid rgba(232,200,120,.5);padding-left:12px;margin:12px 0}

/* ---------- 时间线 ---------- */
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:linear-gradient(180deg,var(--gold),rgba(196,158,84,.1))}
.tl-item{position:relative;margin-bottom:16px}
.tl-item::before{content:'';position:absolute;left:-22px;top:6px;width:9px;height:9px;border-radius:50%;
  background:var(--gold2);box-shadow:0 0 0 3px rgba(232,200,120,.14)}
.tl-item .y{font-family:var(--serif);font-size:12px;color:var(--gold2);letter-spacing:1px}
.tl-item .t{font-family:var(--serif);font-size:15px;font-weight:700;margin:3px 0 6px}
.tl-item .d{font-size:12.5px;color:#C9C2B0;line-height:1.8}

/* ---------- 我的 ---------- */
.me-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.me-top .ava{width:64px;height:64px}
.me-top .nm{font-family:var(--serif);font-size:19px;font-weight:900;letter-spacing:1px}
.list{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;justify-content:space-between;padding:14px 15px;font-size:13.5px;cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.05)}
.li:last-child{border-bottom:0}
.li .r{color:var(--muted);font-size:12px}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:30;
  display:flex;background:rgba(9,19,27,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.tb{flex:1;text-align:center;font-size:10px;color:var(--muted);cursor:pointer;padding:4px 0;letter-spacing:1px}
.tb .g{font-family:var(--serif);font-size:17px;display:block;margin-bottom:3px;color:inherit}
.tb.on{color:var(--gold2)}
.tb.on .g{text-shadow:0 0 14px rgba(232,200,120,.5)}

/* ---------- 浮层 ---------- */
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:60;
  background:rgba(20,36,48,.96);border:1px solid var(--line);color:var(--gold2);
  padding:10px 18px;border-radius:999px;font-size:12.5px;box-shadow:0 10px 26px rgba(0,0,0,.5)}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,8,12,.6)}
.sheet .box{width:100%;max-width:480px;background:#0E1C27;border-top-left-radius:20px;border-top-right-radius:20px;
  border-top:1px solid var(--line);padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(18px);opacity:.4}to{transform:none;opacity:1}}
.fade{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.note{font-size:11px;color:#6F817A;line-height:1.8}
h3{font-family:var(--serif);font-size:14px;margin:16px 0 8px;color:var(--gold2);letter-spacing:1px}

/* ---------- 列表容器（手机默认单列） ---------- */
.cols{display:block}
.playwrap{display:block}

/* ==================== 桌面横版 ==================== */
@media (min-width:900px){
  html,body{height:100%}
  body{display:block;background:#05090D}
  #phone{width:auto;max-width:none;min-height:100vh;margin:0;padding:0 0 48px 112px;overflow:visible}
  #app{max-width:none;margin:0}

  /* 左侧竖导航 */
  #tabbar{position:fixed;left:0;top:0;bottom:0;width:112px;z-index:40;display:flex;align-items:center;
    background:linear-gradient(180deg,#0C1A26,#070E15);border-right:1px solid var(--line)}
  #tabbar .tabbar{position:static;left:auto;bottom:auto;transform:none;width:100%;max-width:none;
    display:flex;flex-direction:column;gap:6px;padding:0 10px;background:none;border:0;backdrop-filter:none}
  #tabbar .tb{padding:14px 0;border-radius:12px;font-size:11px;letter-spacing:2px;transition:background .15s}
  #tabbar .tb .g{font-size:22px;margin-bottom:5px}
  #tabbar .tb:hover{background:rgba(255,255,255,.05)}
  #tabbar .tb.on{background:rgba(232,200,120,.07)}
  #tabbar .tb.on::after{left:4px;right:auto;top:50%;bottom:auto;width:3px;height:22px;border-radius:3px;
    transform:translateY(-50%);box-shadow:0 0 14px rgba(232,200,120,.7)}
  #tabbar::before{content:'时光侦局';position:absolute;top:26px;left:0;width:100%;text-align:center;
    font-family:var(--serif);font-size:13px;letter-spacing:3px;color:var(--gold2)}
  #tabbar::after{content:'穿越千年';position:absolute;bottom:26px;left:0;width:100%;text-align:center;
    font-size:10px;letter-spacing:2px;color:#5E7270}

  .wrap{max-width:1040px;margin:0 auto;padding:30px 40px 20px}
  .topbar{padding:16px 40px}
  .h1{font-size:28px}
  .muted{font-size:13px}
  .card{padding:20px;margin-bottom:16px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .cols .card,.cols .ep,.cols .level{margin-bottom:0}
  .grid{grid-template-columns:repeat(4,1fr);gap:16px}
  .rc .pic{height:130px}
  .rc .pic img{max-height:130px}
  .ep .thumb{width:84px;height:112px}
  .script .cover{width:92px;height:118px}
  .script .cover img{border-radius:14px}
  .cols .card{min-height:118px}
  .splash .logo{font-size:72px;letter-spacing:16px}
  .splash .slog{font-size:16px;letter-spacing:10px}
  .splash .inner{max-width:760px;margin:0 auto;padding-bottom:96px}

  /* 短剧播放：左视频右内容 */
  .playwrap{display:grid;grid-template-columns:400px 1fr;gap:36px;align-items:start;padding-top:26px}
  .playwrap .player{position:sticky;top:80px}
  .playwrap .pr .card{margin-top:0}
  .playwrap .pr{max-width:640px}
  .playwrap .pr .choice2{max-width:560px}
  .analysis,.qtext,.material{max-width:760px}
}
@media (min-width:1400px){
  .wrap{max-width:1140px}
}

/* ==================== v2 视觉升级 ==================== */
:root{
  --shadow:0 20px 44px -22px rgba(0,0,0,.85);
  --shadow-s:0 10px 24px -14px rgba(0,0,0,.8);
  --hi:inset 0 1px 0 rgba(255,255,255,.06);
  --goldgrad:linear-gradient(135deg,#F7E4B4 0%,#E8C878 42%,#C49E54 72%,#A87F35 100%);
}

.back{font-size:19px;line-height:1;padding-bottom:1px}

.card{border-radius:20px;padding:18px;border:1px solid rgba(196,158,84,.2);

.card.tap:hover{border-color:rgba(232,200,120,.4);box-shadow:0 18px 38px -20px #000,var(--hi)}

/* 按钮 */
.btn{font-weight:600;border-radius:14px;letter-spacing:.5px}
.btn.primary{background:var(--goldgrad);color:#1D1405;border:1px solid rgba(255,255,255,.28);

.entry .go{font-size:20px;opacity:.7}

.progressbar>i{background:linear-gradient(90deg,#6FC3B6,#E8C878 70%,#F7E4B4)}

.analysis{border-left-width:3px;border-radius:0 14px 14px 0;

.chat .msg .bubble{border-radius:16px;box-shadow:var(--hi)}

/* 图鉴 */
.rc{border-radius:18px;box-shadow:var(--shadow-s),var(--hi);transition:transform .16s,border-color .16s}

.rc .pic img{filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.quote{font-size:13.5px;letter-spacing:.5px}

.tl-item::before{box-shadow:0 0 0 4px rgba(232,200,120,.1),0 0 14px rgba(232,200,120,.5)}

/* 我的 */

.li:hover{background:rgba(232,200,120,.05)}

/* tabbar */
.tabbar{background:rgba(7,14,20,.9);border-top:1px solid rgba(196,158,84,.18);

function pickAvatar() {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'); const s = 160;
        c.width = s; c.height = s;
        const ctx = c.getContext('2d');
        const side = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, s, s);
        const url = c.toDataURL('image/jpeg', .82);
        $('#avaPrev').src = url; window.__pendingAvatar = url;
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  };
  i.click();
}

function findLastAct() {

  }

function dramaChoose(id, k, label) {
  const e = EPISODES.find(x => x.id === Number(id));
  const ok = recordChoice({ key: k, src: 'drama', title: e.title, label }, POINTS.relay);
  if (!ok) {
    // 已经记过：把老的记录补上 key，避免后续卡片对不上
    const recs = PROG.choices.filter(c => c.src === 'drama' && c.title === e.title);
    const hit = recs.find(c => c.label === label);
    if (hit && !hit.key) { hit.key = k; saveProg(); }
    toast('这条已经记过，接着往下走就行');
  } else {
    toast('抉择已记录 +' + POINTS.relay);
  }
  if (!AI_ON) { render(true); return; }
  if (ok || !genOf(e.id + '-' + k).parts.length) genDrama(e.id, k, label);
  else render(true);
  setTimeout(() => {
    const a = document.querySelector('.cont') || document.querySelector('.analysis') || document.querySelector('.nextbtn');
    if (a && a.scrollIntoView) a.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }, 80);
}
function dramaPick(id, act) {

function dramaCustom(id) {

function dramaOpts(id) {

function dramaRegen(id) {

function genDrama(id, k, label, mode, act) {
  const e = EPISODES.find(x => x.id === Number(id));
  const gk = id + '-' + k;
  const old = genOf(gk).parts;
  const sys = '你是历史短剧编剧。文字要克制、有画面感、带史料味，只写场景与动作，不评论，不编造具体制度或数字。';
  const ask = '第' + id + '集《' + e.title + '》梗概：' + e.desc + '。观众在结尾选择：' + label +
    '。请续写这个选择之后发生了什么，60 到 90 字，只用现代白话短句，句子要完整通顺，不堆文言虚词，只输出正文，不要标题和解释。';
  let msgs;
  if (mode === 'more' && old.length) {
    const step = String(act || '').trim() || '继续往前走';
    msgs = [
      { role: 'user', content: ask },
      { role: 'assistant', content: old.join('') },
      { role: 'user', content: '玩家决定：' + step + '。请写出这个决定发生之后的场面，60 到 90 字，只写场景和动作，不要总结、不要重复上文，只输出正文。' }
    ];
  } else if (mode === 'regen' && old.length) {
    msgs = [{ role: 'user', content: ask }]
      .concat(old.slice(0, -1).map(p => ({ role: 'assistant', content: p })))
      .concat([{ role: 'user', content: '重写最后这一段，换个写法，仍是 60 到 90 字，只输出正文。' }]);
  } else {
    msgs = [{ role: 'user', content: ask }];
  }
  GEN[gk] = 'loading';
  render(true);
  aiChat(sys, msgs).then(t => {
    GEN[gk] = '';
    PROG.gen = PROG.gen || {};
    let list;
    if (mode === 'more') list = old.concat(t);
    else if (mode === 'regen') list = old.slice(0, -1).concat(t);
    else list = [t];
    if (list.length > 10) list = list.slice(-10);
    PROG.gen[gk] = { parts: list, opts: [] };
    saveProg();
    render(true);
    genDramaOpts(id, k);
    setTimeout(() => {
      const a = document.querySelector('.cont');
      if (a && a.scrollIntoView) a.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }, 60);
  }).catch(() => {
    GEN[gk] = 'error';
    toast('这次没生成成功，先用本地续写');
    render(true);
  });
}
function genDramaOpts(id, k) {
  const e = EPISODES.find(x => x.id === Number(id));
  if (!e) return;
  const gk = id + '-' + k;
  const g = genOf(gk);
  if (!g.parts.length) return;
  GENOPT[gk] = 'loading';
  render(true);
  const sys = '你在给历史短剧的观众出「下一步怎么做」的选项，只写动作，不写解释。';
  const ask = '第' + id + '集《' + e.title + '》梗概：' + e.desc + '。当前剧情：' + g.parts.join('') +
    '。请给出主角接下来可以做的 2 个不同动作，每个不超过 12 个字，两个动作方向要明显不同，输出两行，形如：1. 上前叩关\n2. 先遣甘父探路';
  aiChat(sys, [{ role: 'user', content: ask }]).then(t => {
    const lines = String(t)
      .split(/\n+/)
      .map(s => s.replace(/^\s*(?:\d+|一|二|①|②)\s*[.、．)）:：]\s*/, '').replace(/^[-*]\s*/, '').trim())
      .filter(Boolean)
      .slice(0, 2);
    if (!lines.length) throw new Error('empty');
    GENOPT[gk] = '';
    PROG.gen = PROG.gen || {};
    PROG.gen[gk] = { parts: genOf(gk).parts, opts: lines };
    saveProg();
    render(true);
  }).catch(() => {
    GENOPT[gk] = 'error';
    render(true);
  });
}

function answer(key) {
  const route = parseRoute(); const n = Number(route.seg[1]) || 1;
  const bank = BANKS[n - 1]; const q = QUIZ[n]; if (q.chose) return;
  const item = bank.questions[q.i];
  q.chose = key;
  const right = key === item.answer;
  if (right) q.right += 1;
  const opt = item.options.find(o => o.key === item.answer);
  recordAnswer(right, {
    key: 'L' + n + 'Q' + q.i, level: n, levelLabel: bank.label, q: q.i,
    question: item.question, chosen: key,
    chosenLabel: (item.options.find(o => o.key === key) || {}).label || '',
    answer: item.answer, answerLabel: opt.label, analysis: item.analysis, material: item.material
  });
  render(true);
}
function nextQ(n) {
  const q = QUIZ[n]; const bank = BANKS[n - 1];
  if (q.i >= bank.questions.length - 1) {
    q.done = true;
    q.unlocked = finishLevel(n, q.right);
  } else { q.i += 1; q.chose = ''; }
  render(true);
}

    <div class="card"><div class="h2">闯关进度</div>${levels}
      <div class="muted">累计作答 ${s.answered} 题，答对 ${s.correct} 题。</div></div>
    <div class="card"><div class="h2">你的抉择（最近 5 条）</div>
      ${choices.length ? choices.map(c => `<div class="kv" style="align-items:flex-start">
        <b style="width:auto;color:var(--gold2);font-family:var(--serif)">${esc(c.title)}</b>
        <span style="flex:1;text-align:right">${esc(c.label)}</span>
        <span style="color:var(--teal2);font-size:11px">+${c.points}</span></div>`).join('')
        : '<div class="muted">还没有做过抉择。剧本和短剧里各有一处。</div>'}
      <div class="divider"></div><div class="muted">共记录 ${PROG.choices.length} 次抉择。</div></div>
    <div class="card tap" onclick="GO('wrong')"><div class="between"><div><div style="font-family:var(--serif)">错题本</div>
      <div class="muted" style="margin-top:5px">${PROG.wrong.length} 道待订正</div></div><div class="go">›</div></div></div>
    <div class="note">报告数据只存在本机浏览器，换设备不会同步。</div>
  </div>`;
}

/* ==================== 错题本 ==================== */
function viewWrong() {
  if (!PROG.wrong.length) {
    return `${topbar('错题本', '0 道')}<div class="wrap fade" style="text-align:center;padding-top:50px">
      <div style="font-size:40px">✓</div><div class="h1" style="margin-top:16px">干净</div>
      <div class="muted">目前没有错题，去闯关试试。</div>
      <button class="btn primary" style="margin-top:22px" onclick="GO('challenge')">去闯关</button></div>`;
  }
  const groups = {};
  PROG.wrong.slice().sort((a, b) => b.time - a.time).forEach(w => { (groups[w.level] = groups[w.level] || []).push(w); });
  const body = Object.keys(groups).sort((a, b) => a - b).map(lv => {
    const items = groups[lv].map(w => `<div class="card" style="padding:14px">
      <div class="between"><span class="tag gold">第 ${w.level} 关 · ${esc(w.levelLabel)}</span><span class="muted" style="font-size:10px">第 ${w.q + 1} 题</span></div>
      <div class="material" style="margin-top:10px;font-size:12.5px">${esc(w.material)}</div>
      <div class="qtext" style="font-size:13.5px">${esc(w.question)}</div>
      <div class="kv"><b>你选</b><span style="color:#E09A9A">${esc(w.chosen)}. ${esc(w.chosenLabel)}</span></div>
      <div class="kv"><b>正确</b><span style="color:var(--teal2)">${esc(w.answer)}. ${esc(w.answerLabel)}</span></div>
      <div class="analysis">${esc(w.analysis)}</div></div>`).join('');
    return `<div class="h3">第 ${lv} 关 · ${esc(groups[lv][0].levelLabel)}（${groups[lv].length} 题）</div>${items}`;
  }).join('');
  return `${topbar('错题本', PROG.wrong.length + ' 道待订正')}<div class="wrap fade">
    ${body}
    <button class="btn ghost block" style="margin-top:8px" onclick="clearWrong()">清空错题本</button></div>`;
}
function clearWrong() { PROG.wrong = []; saveProg(); toast('已清空'); render(true); }

/* ==================== 我的 ==================== */
function viewProfile() {
  const s = summary();
  return `<div class="wrap fade">
    <div class="me-top"><div class="ava" onclick="pickAvatarProfile()">${avatarImg(USER.avatar)}</div>
      <div style="flex:1"><div class="nm">${esc(USER.name)}</div>
        <div class="muted" style="margin-top:5px">${s.acts ? '已结案 ' + s.acts + ' 幕 · ' : ''}积分 ${s.points}</div></div>
      <button class="btn ghost sm" onclick="rename()">改昵称</button></div>
    <div class="points"><div><b>${s.points}</b><span>积分</span></div>
      <div><b>${s.stars}/${s.maxStars}</b><span>星数</span></div><div><b>${s.atlasPercent}%</b><span>图鉴</span></div></div>
    <div class="card"><div class="between"><div><div style="font-family:var(--serif)">史料图鉴</div>
      <div class="muted" style="margin-top:5px">已收 ${s.collected}/${s.relicTotal} 件</div></div>
      <button class="btn ghost sm" onclick="GO('atlas')">查看</button></div>
      <div class="progressbar" style="margin-top:10px"><i style="width:${s.atlasPercent}%"></i></div></div>
    <div class="list" style="margin-bottom:14px">
      <div class="li" onclick="GO('report')"><span>学习报告</span><span class="r">›</span></div>
      <div class="li" onclick="GO('wrong')"><span>错题本</span><span class="r">${PROG.wrong.length} 道 ›</span></div>
      <div class="li" onclick="GO('timeline')"><span>历史时间线</span><span class="r">4 站 ›</span></div>
      <div class="li" onclick="GO('about')"><span>关于与说明</span><span class="r">›</span></div>
    </div>
    <button class="btn ghost block" onclick="resetAll()">重置全部进度</button>
    <div class="note" style="margin-top:14px">头像与昵称、答题与抉择记录都只保存在本机浏览器，不上传服务器，也不提供第三方。</div>
  </div>`;
}
function rename() {
  const n = prompt('新的昵称', USER.name);
  if (n && n.trim()) { USER.name = n.trim().slice(0, 12); localStorage.setItem(UKEY, JSON.stringify(USER)); render(true); }
}
function pickAvatarProfile() {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = c.height = 160;
        const side = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 160, 160);
        USER.avatar = c.toDataURL('image/jpeg', .8);
        try { localStorage.setItem(UKEY, JSON.stringify(USER)); } catch (e) {}
        render(true);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  };
  i.click();
}
function resetAll() {
  if (!confirm('清空全部积分、星数、图鉴与记录？此操作不可恢复。')) return;
  PROG = blank(); saveProg(); Object.keys(QUIZ).forEach(k => delete QUIZ[k]);
  Object.keys(STORY_UI).forEach(k => delete STORY_UI[k]);
  toast('已重置'); render(true);
}

/* ==================== 关于 ==================== */
function viewAbout() {
  const s = summary();
  return `${topbar('关于时光侦局', '版本 1.0 · 网页体验版')}<div class="wrap fade">
    <div class="card"><div class="h2">这是什么</div>
      <div class="muted" style="line-height:1.9">「时光侦局」是一个历史情境学习工具：用剧本杀、AI 短剧和史料闯关，把汉代史料变成可以亲手参与的情境。本站为小程序版的网页移植。</div></div>
    <div class="card"><div class="h2">AI 与内容标识</div>
      <div class="muted" style="line-height:1.9">剧本页对话默认由本地史料规则生成，不联网；短剧为 AI 生成素材，页面已标注「AI 历史短剧」，请勿当作史料影像使用。史料原文引用《史记》《汉书》与汉简释文，注释为教学性解释。</div></div>
    <div class="card"><div class="h2">数据与隐私</div>
      <div class="muted" style="line-height:1.9">昵称、头像、积分、答题与抉择记录全部保存在你本机浏览器（localStorage），不上传服务器，也不提供给第三方。换浏览器或清缓存会丢失。</div></div>
    <div class="card"><div class="h2">当前状态</div>
      <div class="kv"><b>积分</b><span>${s.points}</span></div>
      <div class="kv"><b>图鉴</b><span>${s.collected}/${s.relicTotal}</span></div>
      <div class="kv"><b>视频</b><span>外链 CDN</span></div>
      <div class="kv"><b>AI</b><span>${AI_ON ? (AI_ENDPOINT ? '已接中转' : '真 AI 已开') : '本地剧情'}</span></div>
    </div>
    <div class="note">本项目为个人学习作品，非经营性服务，不提供付费、课程售卖或直播。</div>
  </div>`;
}

/* ==================== 路由 ==================== */
function parseRoute() {
  const raw = (location.hash || '#/index').replace(/^#\//, '');
  const seg = raw.split('/').filter(Boolean);
  return { name: seg[0] || 'index', seg };
}
const MAIN = ['index', 'story', 'drama', 'challenge', 'profile'];
function isWide() { return window.innerWidth >= 900; }
function render(keepScroll) {
  const r = parseRoute();
  const y = window.scrollY;
  let html = '', tab = '';
  switch (r.name) {
    case 'splash': html = viewSplash(); break;
    case 'login': html = viewLogin(); break;
    case 'index': html = viewIndex(); tab = tabbar('index'); break;
    case 'story':
      html = r.seg.length >= 3 ? viewStoryAct(r.seg[1], r.seg[2]) : viewStoryList();
      tab = r.seg.length >= 3 ? '' : tabbar('story');
      break;
    case 'drama':
      html = r.seg.length >= 2 ? viewDramaPlay(r.seg[1]) : viewDrama();
      tab = r.seg.length >= 2 ? '' : tabbar('drama');
      break;
    case 'challenge':
      html = r.seg.length >= 2 ? viewQuiz(r.seg[1]) : viewChallengeList();
      tab = r.seg.length >= 2 ? '' : tabbar('challenge');
      break;
    case 'relic': html = viewRelic(r.seg[1] || 'hufu'); break;
    case 'atlas': html = viewAtlas(); break;
    case 'timeline': html = viewTimeline(); break;
    case 'report': html = viewReport(); break;
    case 'wrong': html = viewWrong(); break;
    case 'about': html = viewAbout(); break;
    case 'profile': html = viewProfile(); break;
    default: html = viewIndex(); tab = tabbar('index');
  }
  const isMain = MAIN.indexOf(r.name) >= 0 && r.seg.length <= 1;
  const ROOT = { relic: 'atlas', atlas: 'atlas', timeline: 'index', report: 'profile', wrong: 'profile', about: 'profile' };
  const activeKey = isMain ? r.name : (ROOT[r.name] || 'index');
  const showRail = r.name !== 'splash' && r.name !== 'login' && (isMain || isWide());
  tab = showRail ? tabbar(activeKey) : '';
  if (document.body && document.body.dataset) {
    document.body.dataset.rail = showRail ? '1' : '0';
    document.body.dataset.view = r.name;
  }
  $('#app').innerHTML = html;
  $('#tabbar').innerHTML = tab;
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  document.title = '时光侦局 · ' + ({ splash: '穿越千年', login: '登录', index: '首页', story: '历史剧本杀', drama: 'AI 历史短剧', challenge: '史料闯关', relic: '史料图鉴', atlas: '史料图鉴', timeline: '历史时间线', report: '学习报告', wrong: '错题本', about: '关于', profile: '我的' }[r.name] || '穿越千年');
}
window.addEventListener('hashchange', () => render());
let wideCache = isWide();
window.addEventListener('resize', () => {
  const w = isWide();
  if (w !== wideCache) { wideCache = w; render(true); }
});
window.addEventListener('load', () => {
  if (!location.hash) location.hash = '#/splash';
  render();
});
render();

</script>
</body>
</html>
